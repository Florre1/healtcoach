name: Release build (unsigned)
# Builds an unsigned release APK. Signing happens afterwards with the personal
# key, which never leaves the owner's control and is not stored on GitHub.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: healthcoach-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
