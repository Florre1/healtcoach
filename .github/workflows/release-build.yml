name: Release build (unsigned)
# Builds an unsigned release APK. Signing happens afterwards with the personal
# key, which never leaves the owner's control and is not stored on GitHub.
# The unsigned APK is attached to a draft release; it is replaced by the
# signed APK before the release is published.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - name: Attach unsigned APK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          tag="v$version"
          cp build/app/outputs/flutter-apk/app-release.apk "healthcoach-$version-unsigned.apk"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "HealthCoach $version" --notes "Entwurf"
          gh release upload "$tag" "healthcoach-$version-unsigned.apk" --clobber
